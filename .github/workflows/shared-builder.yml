name: Shared builder validation
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/package_builder.py --output /tmp/builder-validation
      - run: python3 -m unittest discover -s scripts -p test_shared_resources.py -v
