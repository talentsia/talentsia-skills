name: Validate release package
on:
  push:
    branches: [main]
    tags: ['v*', 'talentsia-work-v*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package and verify release artifacts
        run: |
          python3 scripts/package.py --output /tmp/talentsia-do-ci
          python3 scripts/skill_file.py --output /tmp/talentsia-do-ci
          python3 scripts/check_candidate.py --output /tmp/talentsia-do-ci
          python3 scripts/privacy_scan.py --output /tmp/talentsia-do-ci
          python3 scripts/package_work.py --output /tmp/talentsia-work-ci
          python3 scripts/privacy_scan.py --output /tmp/talentsia-work-ci
          git diff --exit-code
